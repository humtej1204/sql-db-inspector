<section class="filter_section">
  <mat-form-field appearance="outline">
    <input matInput (keyup)="applyFilter($event)" placeholder="Busca una tabla" #input />
  </mat-form-field>

  <mat-slide-toggle [(ngModel)]="showEmptyTables" (change)="handleShowEmptyTables()">
    Ver tablas vacias
  </mat-slide-toggle>
</section>

<section class="table_container">
  <table mat-table [dataSource]="source" matSort (matSortChange)="announceSortChange($event)">
    <ng-container matColumnDef="name" [sticky]="true">
      <th mat-header-cell *matHeaderCellDef>Nombre Completo</th>
      <td mat-cell *matCellDef="let element">{{ element.name }}</td>
    </ng-container>

    <ng-container matColumnDef="schema">
      <th mat-header-cell *matHeaderCellDef>Schema</th>
      <td mat-cell *matCellDef="let element">{{ element.schema }}</td>
    </ng-container>

    <ng-container matColumnDef="rows">
      <th
        mat-header-cell
        *matHeaderCellDef
        mat-sort-header
        sortActionDescription="Sort by cuantity data"
      >
        Cantidad de Datos
      </th>
      <td mat-cell *matCellDef="let element" class="align_end">{{ element.rows }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns; sticky: true"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</section>
