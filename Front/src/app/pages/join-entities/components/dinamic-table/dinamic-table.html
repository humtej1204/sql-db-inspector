<mat-form-field appearance="outline">
  <mat-label>Filtrar</mat-label>
  <input matInput (keyup)="applyFilter($event.target.value)" placeholder="Buscar..." />
  <mat-icon matSuffix fontIcon="search"></mat-icon>
</mat-form-field>

<div class="table_container">
  <table mat-table [dataSource]="dataSource" matSort>
    @for (item of displayedColumns; track $index) {
    <ng-container [matColumnDef]="item">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>{{ item }}</th>
      <td mat-cell *matCellDef="let row">{{ cellValue(row, item) }}</td>
    </ng-container>
    }

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>
</div>

<mat-paginator [pageSize]="10" [pageSizeOptions]="[10, 50, 100, 250]" showFirstLastButtons />
