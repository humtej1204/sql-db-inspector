<section class="filter_section">
  <mat-form-field appearance="outline">
    <input matInput (keyup)="applyFilter($event)" placeholder="Busca una tabla" #input />
  </mat-form-field>

  <mat-slide-toggle [(ngModel)]="showEmptyTables" (change)="handleShowEmptyTables()">
    Ver tablas vacias
  </mat-slide-toggle>
</section>

<section class="table_container">
  <table mat-table [dataSource]="source" multiTemplateDataRows>
    @for (column of columnsToDisplay; track column) {
    <ng-container matColumnDef="{{ column }}">
      <th mat-header-cell *matHeaderCellDef>{{ getcolumnHeader(column) }}</th>
      <td mat-cell *matCellDef="let element" [class.center_align]="column === 'rows'">
        {{ element[column] }}
      </td>
    </ng-container>
    }

    <ng-container matColumnDef="expand">
      <th mat-header-cell *matHeaderCellDef>&nbsp;</th>
      <td mat-cell *matCellDef="let element" class="right_align">
        <button
          matIconButton
          (click)="toggle(element); $event.stopPropagation()"
          class="toggle-button"
          [class.toggle-button-expanded]="isExpanded(element)"
        >
          <mat-icon>keyboard_arrow_down</mat-icon>
        </button>
      </td>
    </ng-container>

    <ng-container matColumnDef="expandedDetail">
      <td mat-cell *matCellDef="let element" [attr.colspan]="columnsToDisplayWithExpand.length">
        <div
          class="element-detail-wrapper"
          [class.element-detail-wrapper-expanded]="isExpanded(element)"
        >
          <div class="element-detail"><app-table-info [data]="element" /></div>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="columnsToDisplayWithExpand; sticky: true"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: columnsToDisplayWithExpand"
      class="element-row"
      [class.expanded-row]="isExpanded(row)"
      (click)="toggle(row)"
    ></tr>
    <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class="detail-row"></tr>
  </table>
</section>
