version: "3.7"

services:
  ms.service.haru:
    container_name: ms.service.haru
    labels:
      svc: "ms-service-haru"
    restart: always
    build:
      context: ./
      dockerfile: ./Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ${HOME}/.azure:/root/.azure:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/v1/health || exit 1"]
      interval: 30s
      timeout: 30s
      retries: 10
